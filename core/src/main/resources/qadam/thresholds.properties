# Qadam — every tunable number, in one file.
#
# The SPEC §6 values are PLACEHOLDERS until Phase 1 replaces them with numbers from
# Ammar's own data (analysis/qadam_analyze.py prints replacement lines in this format).
# The app reads this file as its defaults; the Rules screen can change a value later,
# under the 24-hour rule (SPEC §8). The Phase 1 script reads it too.
#
# Units are in the key: _min = minutes, _s = seconds, _h = hours, _hz = per second.

# ---- §6 States (placeholders) ----
# CHORE: lasts this long after a tag tap; another tap extends it.
chore.duration_min=30
# CHORE ends early if screen on + scrolling + no steps holds this long.
chore.cancel_min=5
# "Scrolling" for the CHORE cancel rule: at least this many scrolls in each minute.
chore.cancel_scrolls_per_min=1
# MOVING: at least this many steps in the window.
moving.steps=20
moving.window_min=3
# DRIFT_SCREEN: a drift app in front this long without a break ...
drift_screen.min=10
# ... and fewer than this many steps in the steps window.
drift_screen.max_steps=10
drift_screen.steps_window_min=5
# A drift-app session counts as unbroken unless the drift app is away this long.
drift_screen.break_s=60
# DRIFT_SCROLL: at least this many scrolls per minute, sustained this long.
drift_scroll.per_min=6
drift_scroll.min=3
# DRIFT_AUDIO: audio on, screen off, at most this many steps, for this long.
drift_audio.min=15
drift_audio.max_steps=0
# DANGER WINDOW (meal windows): the three time thresholds above are multiplied by this.
danger.factor=0.5
# Reset to Level 0: this many steps within the window ...
reset.steps=50
reset.steps_window_min=5
# ... or the screen off this long with no audio.
reset.screen_off_min=10

# ---- §7 Ladder ----
# Level 1 "Getting up": at least this many steps must follow within the grace time.
level1.getting_up_grace_min=2
level1.getting_up_steps=1
# Level 1 "5 more minutes": length, and at most once per this many minutes.
level1.more_min=5
level1.more_every_min=60
# Level 1 "Wrong, I'm not drifting": snooze length.
level1.wrong_snooze_min=15
# Level 2 after Level 1 changed nothing for this long ...
level2.after_level1_min=3
# ... or at a second trigger within this many minutes.
level2.second_trigger_min=30
# Level 2: typing the next action buys this many minutes; it needs this many words.
level2.grant_min=5
level2.min_words=3
# Level 3 this long after Level 2 began.
level3.after_level2_min=5
# Level 3 blocks drift apps this long.
level3.block_min=20
# Hard override: hold time, and how many per day.
level3.override_hold_s=30
level3.override_per_day=2

# ---- §8 Commitment ----
# "Pause 1 hour": its length and how many per day.
pause.min=60
pause.per_day=1

# ---- §4 Sensors and logging ----
# Accelerometer rate for the fallbacks (step detector, gravity, motion).
sensors.rate_hz=20
# Motion level: RMS of linear acceleration over this window.
motion.window_s=10
# Gravity low-pass time constant (fallback when the phone has no gravity sensor).
gravity.tau_s=0.8
# Summary rows: every 30 s while the screen is on or audio plays; every 5 min otherwise.
summary.active_s=30
summary.idle_s=300
# Proximity: "near" when the reported distance is below this (cm).
proximity.near_cm=3

# ---- §4 Accelerometer step detector ----
# Walking rhythm: steps between these rates (per second).
step.min_hz=1.0
step.max_hz=2.5
# A peak of the smoothed magnitude must rise this far above the slow average (m/s^2).
step.min_peak=0.8
# Steps count only inside a run of at least this many peaks at a steady pace.
step.min_run=4
# Smoothing time constant for the magnitude (s).
step.smooth_s=0.05

# ---- §11 Experience sampling ----
sampling.per_day=5
# Prompts fall between this hour and bedtime, at least this many minutes apart.
sampling.start_hour=8
sampling.min_gap_min=60
# A due prompt waits this long for the screen to come on, then is dropped.
sampling.wait_min=60
